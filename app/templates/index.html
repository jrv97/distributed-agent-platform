{% extends "base.html" %} {% block content%}
<div class="container">
<div class="row">
<div class="container-fluid col-sm-4">
        <div class="page-header"> <h3> Agent Creation </h3> </div>
        


        <div class="panel">
            <div class="panel-body">
                <form  action="http://localhost:5000/result" method="POST">
                       
                <div class="form-group">
                    <label>Agent Name
                        <input class="form-control" type="text" name="agent_name" required>
                    </label>
                </div>

                <fieldset>
                    <legend> Functionalities </legend>
                    {% for func in functionalities %}
                    <div class="checkbox"><label class="choice"> <input type="checkbox" name="{{func}}" > {{ func }} </label></div>
                    {% endfor %}
                </fieldset>

                <div class="form-group">
                    <label> Notes
                        <textarea class="text form-control" name="notes" rows="5" maxlength="500"> </textarea>
                    </label>
                </div>

                <div class="form-group">
                    <input class="button btn btn-primary" type="submit" value="Create Agent" /></p>
                </div>
            </form>
            </div>
        </div>
</div>
</div>
</div>
{% endblock %}
